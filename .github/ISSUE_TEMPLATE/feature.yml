# SPDX-License-Identifier: AGPL-3.0-or-later
name: Feature request
description: Suggest something Saucepenny should do.
title: 'Feature: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem in your own words. Do not paste screenshots or text
        from other products; Saucepenny is a clean-room project.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Saucepenny help?
